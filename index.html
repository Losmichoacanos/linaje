/* Layout: plumage-green sidebar + ring-search top bar; each section owns a color (ejemplares comb red, cruces violet, peleas gold, finanzas teal) */
:root{
  --bg:#f1f4ee; --surface:#ffffff; --surface-2:#f5f7f2; --ink:#14201a; --ink-2:#4a5a50; --ink-3:#7c8b81; --rule:#dfe5dc;
  --red:#cf3427; --red-s:#fde7e4; --gold:#c27f05; --gold-s:#fdf0d2; --violet:#6d4bd1; --violet-s:#ece6fd;
  --teal:#0e8a7d; --teal-s:#d8f3ef; --blue:#2f6fd0; --blue-s:#e1ebfb; --leaf:#2e8b57; --leaf-s:#dcf1e3;
  --slate:#56677a; --slate-s:#e6ebf0; --orange:#d9621f; --pink:#c2457f;
  --nav-a:#0e2419; --nav-b:#0b3a33; --nav-ink:#e9f2ec; --nav-ink-2:#9fbcad;
  --shadow:0 1px 2px rgba(20,32,26,.06),0 4px 14px rgba(20,32,26,.05);
  --display:"Zilla Slab", Rockwell, Georgia, serif;
  --body:"Public Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --nav-w:236px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1310; --surface:#121c17; --surface-2:#18241e; --ink:#e6ede6; --ink-2:#a6b5aa; --ink-3:#74867a; --rule:#24332b;
  --red:#ff6b5e; --red-s:#3b1c19; --gold:#f0b43c; --gold-s:#3a2c10; --violet:#a58bff; --violet-s:#2a2145;
  --teal:#3cc9b7; --teal-s:#10302b; --blue:#6fa3ff; --blue-s:#172a47; --leaf:#5fcf8c; --leaf-s:#143222;
  --slate:#93a4b6; --slate-s:#1e2731; --orange:#ff8a4c; --pink:#ff7fb6;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1310; --surface:#121c17; --surface-2:#18241e; --ink:#e6ede6; --ink-2:#a6b5aa; --ink-3:#74867a; --rule:#24332b;
  --red:#ff6b5e; --red-s:#3b1c19; --gold:#f0b43c; --gold-s:#3a2c10; --violet:#a58bff; --violet-s:#2a2145;
  --teal:#3cc9b7; --teal-s:#10302b; --blue:#6fa3ff; --blue-s:#172a47; --leaf:#5fcf8c; --leaf-s:#143222;
  --slate:#93a4b6; --slate-s:#1e2731; --orange:#ff8a4c; --pink:#ff7fb6;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;overscroll-behavior:none}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* section colors */
[data-sec="inicio"]{--acc:var(--leaf);--acc-s:var(--leaf-s)}
[data-sec="aves"]{--acc:var(--red);--acc-s:var(--red-s)}
[data-sec="cruces"]{--acc:var(--violet);--acc-s:var(--violet-s)}
[data-sec="combates"]{--acc:var(--gold);--acc-s:var(--gold-s)}
[data-sec="finanzas"]{--acc:var(--teal);--acc-s:var(--teal-s)}
[data-sec="ajustes"]{--acc:var(--slate);--acc-s:var(--slate-s)}

.app{display:grid;grid-template-columns:var(--nav-w) minmax(0,1fr);height:100%;padding-top:env(safe-area-inset-top,0px);background:var(--nav-a)}
.nav{background:linear-gradient(180deg,var(--nav-a),var(--nav-b));color:var(--nav-ink);display:flex;flex-direction:column;gap:22px;padding:22px 14px calc(18px + env(safe-area-inset-bottom,0px));overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand img{width:40px;height:40px;border-radius:10px;flex:none}
.brand div{display:flex;flex-direction:column}
.brand b{font-family:var(--display);font-size:27px;font-weight:700;line-height:1;letter-spacing:-.01em}
.brand span{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--nav-ink-2);margin-top:3px}
.navlist{display:flex;flex-direction:column;gap:3px}
.navbtn{display:flex;align-items:center;gap:12px;padding:10px 10px;border:0;background:none;border-radius:10px;cursor:pointer;color:var(--nav-ink-2);font-weight:600;text-align:left}
.navbtn svg{width:21px;height:21px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.navbtn:hover{background:rgba(255,255,255,.07);color:var(--nav-ink)}
.navbtn[aria-current="page"]{background:var(--acc);color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.navbtn[aria-current="page"] svg{stroke:#fff}
.sync{margin-top:auto;font-size:12px;color:var(--nav-ink-2);display:flex;gap:8px;align-items:flex-start;padding:10px;border-radius:10px;background:rgba(255,255,255,.06)}
.sync .dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex:none;background:#5fcf8c}
.sync[data-s="pend"] .dot{background:#f0b43c}

.work{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg);border-top-left-radius:18px;overflow:hidden}
.topbar{display:flex;gap:12px;align-items:center;padding:14px 32px;border-bottom:1px solid var(--rule);background:var(--surface);position:relative;z-index:5}
.ringsearch{position:relative;flex:1;max-width:560px}
.ringsearch svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:var(--ink-3);fill:none;stroke-width:2;stroke-linecap:round}
.ringsearch input{width:100%;height:48px;border-radius:12px;border:1.5px solid var(--rule);background:var(--surface-2);padding:0 14px 0 44px;font-family:var(--mono);font-size:17px;letter-spacing:.04em}
.ringsearch input::placeholder{font-family:var(--body);letter-spacing:0;color:var(--ink-3);font-size:15px}
.ringsearch input:focus{outline:none;border-color:var(--red);background:var(--surface);box-shadow:0 0 0 4px var(--red-s)}
.rsres{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--rule);border-radius:14px;box-shadow:0 18px 40px rgba(0,0,0,.18);overflow:hidden;max-height:min(460px,70vh);overflow-y:auto}
.rsitem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px;border:0;border-top:1px solid var(--rule);background:none;width:100%;text-align:left;cursor:pointer}
.rsitem:first-child{border-top:0}
.rsitem:hover,.rsitem.on{background:var(--surface-2)}
.rsitem .t{font-weight:600}
.rsitem .m{font-size:12.5px;color:var(--ink-2)}
.rsnone{padding:14px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.topbar .tright{margin-left:auto;display:flex;gap:8px}

main{overflow-y:auto;min-width:0;flex:1;-webkit-overflow-scrolling:touch;padding-bottom:env(safe-area-inset-bottom,0px)}
.page{padding-block:26px 64px;padding-inline:32px;max-width:1260px;display:flex;flex-direction:column;gap:22px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.ph .ttl{display:flex;gap:14px;align-items:center}
.pico{width:48px;height:48px;border-radius:14px;background:var(--acc);display:grid;place-items:center;flex:none;box-shadow:0 6px 16px color-mix(in srgb,var(--acc) 35%,transparent)}
.pico svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ph h1{font-size:32px;line-height:1.05}
.ph p{margin:3px 0 0;color:var(--ink-2)}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--rule);background:var(--surface);padding:9px 15px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px;min-height:42px;white-space:nowrap}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover,.btn.acc:hover{filter:brightness(1.07)}
.btn.soft{background:var(--acc-s);border-color:transparent;color:var(--acc)}
.btn.ghost{background:none;border-color:transparent;color:var(--ink-2)}
.btn.danger{color:var(--red)}
.btn[disabled]{opacity:.5;cursor:default}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13px}

.banner{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--gold-s);border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);padding:12px 16px;border-radius:14px}
.banner p{margin:0;max-width:72ch}

.panel{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:18px 20px;min-width:0;box-shadow:var(--shadow)}
.panel h3{font-size:19px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.panel h3 small{font-family:var(--body);font-size:12px;color:var(--ink-3);font-weight:500}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{padding:16px 18px;display:flex;flex-direction:column;gap:4px;border-radius:16px;min-width:0;background:var(--tone-s);border:1px solid color-mix(in srgb,var(--tone) 18%,transparent)}
.stat .eyebrow{color:color-mix(in srgb,var(--tone) 75%,var(--ink))}
.stat .v{font-family:var(--display);font-size:34px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums;color:var(--tone)}
.stat .s{font-size:13px;color:var(--ink-2)}
.t-red{--tone:var(--red);--tone-s:var(--red-s)} .t-gold{--tone:var(--gold);--tone-s:var(--gold-s)} .t-violet{--tone:var(--violet);--tone-s:var(--violet-s)}
.t-teal{--tone:var(--teal);--tone-s:var(--teal-s)} .t-blue{--tone:var(--blue);--tone-s:var(--blue-s)} .t-leaf{--tone:var(--leaf);--tone-s:var(--leaf-s)}
.v.neg{color:var(--red)!important}

/* ring (leg band) */
.ring{display:inline-flex;align-items:center;font-family:var(--mono);font-weight:500;font-size:13px;letter-spacing:.04em;color:#1b2530;padding:2px 10px;border-radius:999px;background:linear-gradient(180deg,#f4f7f9 0%,#c9d2d9 55%,#e3e9ee 100%);box-shadow:inset 0 1px 0 #fff,inset 0 -1px 0 rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.18);white-space:nowrap}
.ring.lg{font-size:20px;padding:4px 16px}
.ring.none{background:none;box-shadow:none;border:1px dashed var(--rule);color:var(--ink-3)}
.ring mark{background:#ffd76a;color:inherit;border-radius:3px}

.av{display:inline-grid;place-items:center;border-radius:50%;object-fit:cover;flex:none;background:var(--surface-2)}
.av.sm{width:38px;height:38px}.av.md{width:46px;height:46px}
.av.ph{background:color-mix(in srgb,var(--c) 18%,var(--surface));color:var(--c);font-family:var(--display);font-weight:700;font-size:15px;border:2px solid color-mix(in srgb,var(--c) 40%,transparent)}

.rec{display:inline-flex;font-family:var(--mono);font-size:12.5px;border-radius:7px;overflow:hidden;white-space:nowrap}
.rec span{padding:2px 7px;font-weight:500}
.rec .g{background:var(--leaf-s);color:var(--leaf)} .rec .p{background:var(--red-s);color:var(--red)} .rec .t{background:var(--gold-s);color:var(--gold)}
.res{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.res.G{background:var(--leaf);color:#fff} .res.P{background:var(--red);color:#fff} .res.T{background:var(--gold);color:#fff}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--ink-3))}
.st-Activo{background:var(--leaf-s);color:var(--leaf)} .st-Reproductor{background:var(--violet-s);color:var(--violet)}
.st-Vendido{background:var(--blue-s);color:var(--blue)} .st-Baja{background:var(--slate-s);color:var(--slate)} .st-Externo{background:var(--gold-s);color:var(--gold)}
.sx{font-weight:700}.sx.M{color:var(--blue)}.sx.H{color:var(--pink)}

.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--rule)}
.row:first-child{border-top:0}
.row[data-act]{cursor:pointer}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .m{font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.datebox{font-family:var(--mono);font-size:12px;color:var(--ink-3);width:54px;line-height:1.2}
.empty{color:var(--ink-3);font-size:14px;padding:8px 0}

/* Aves */
.split{display:grid;grid-template-columns:minmax(270px,340px) minmax(0,1fr);gap:20px;align-items:start}
.listcol{display:flex;flex-direction:column;gap:10px;position:sticky;top:0}
.filters{display:flex;flex-direction:column;gap:8px}
.inp,.sel{width:100%;border:1px solid var(--rule);background:var(--surface);border-radius:10px;padding:9px 12px;min-height:44px}
textarea.inp{min-height:84px;resize:vertical}
.inp.ringinp{font-family:var(--mono);font-size:18px;letter-spacing:.05em;text-transform:uppercase}
.seg{display:flex;border:1px solid var(--rule);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button,.seg label{flex:1;border:0;background:none;padding:0;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink-2);text-align:center;border-right:1px solid var(--rule);display:flex;min-height:40px}
.seg > :last-child{border-right:0}
.seg button{align-items:center;justify-content:center;padding:8px 6px}
.seg button[aria-pressed="true"],.seg input:checked + span{background:var(--acc,var(--ink));color:#fff}
.seg label span{display:flex;align-items:center;justify-content:center;width:100%;padding:8px 6px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.avelist{background:var(--surface);border:1px solid var(--rule);border-radius:16px;overflow:hidden;max-height:calc(100vh - 300px);overflow-y:auto;box-shadow:var(--shadow)}
.aveitem{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;padding:10px 14px;border:0;border-top:1px solid var(--rule);cursor:pointer;background:none;width:100%;text-align:left}
.aveitem:first-child{border-top:0}
.aveitem:hover{background:var(--surface-2)}
.aveitem[aria-current="true"]{background:var(--red-s)}
.aveitem .n{display:flex;gap:8px;align-items:center;justify-content:space-between;min-width:0}
.aveitem .n b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aveitem .m{font-size:12.5px;color:var(--ink-2);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.count{font-size:12px;color:var(--ink-3)}

.detail{display:flex;flex-direction:column;gap:18px;min-width:0}
.hero{display:grid;grid-template-columns:240px minmax(0,1fr);gap:22px;padding:18px;border-radius:20px;border:1px solid var(--rule);background:linear-gradient(135deg,color-mix(in srgb,var(--c) 22%,var(--surface)) 0%,var(--surface) 62%);box-shadow:var(--shadow)}
.photo{position:relative;aspect-ratio:1/1;border-radius:16px;overflow:hidden;background:color-mix(in srgb,var(--c) 14%,var(--surface-2));display:grid;place-items:center;max-width:100%}
.photo img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.photo .noph{display:flex;flex-direction:column;align-items:center;gap:8px;color:color-mix(in srgb,var(--c) 70%,var(--ink));font-weight:600;font-size:13px;text-align:center;padding:12px}
.photo .noph svg{width:64px;height:64px;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;opacity:.8}
.photo .phbtn{position:absolute;right:8px;bottom:8px}
.photo label.btn{cursor:pointer;background:rgba(255,255,255,.92);color:#14201a;border-color:transparent}
.hinfo{display:flex;flex-direction:column;gap:10px;min-width:0}
.hinfo h2{font-size:40px;line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:4px}
.fact{background:color-mix(in srgb,var(--surface) 75%,transparent);border:1px solid var(--rule);border-radius:12px;padding:9px 12px;display:flex;flex-direction:column;gap:1px;min-width:0}
.fact .k{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.fact .val{font-weight:600;overflow-wrap:anywhere}
.fact .val small{font-weight:400;color:var(--ink-2)}
.hactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:6px}

.compbar{display:flex;height:16px;border-radius:6px;overflow:hidden;background:var(--surface-2)}
.compbar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:13px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend b{width:11px;height:11px;border-radius:3px;display:inline-block}

/* Pedigree */
.pedwrap{overflow-x:auto;margin:0 -4px;padding:4px}
.pedhdr,.ped{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));column-gap:14px;min-width:680px}
.pedhdr{margin-bottom:6px}
.ped{grid-template-rows:repeat(8,minmax(52px,auto));row-gap:6px}
.pn{border:1px solid var(--rule);border-radius:10px;background:var(--surface-2);padding:6px 9px;display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0;cursor:pointer;text-align:left;width:100%}
.pn:hover{border-color:var(--ink-3)}
.pn.M{border-left:4px solid var(--blue)} .pn.H{border-left:4px solid var(--pink)}
.pn.nil{background:none;border-style:dashed;cursor:default;color:var(--ink-3)}
.pn.self{background:var(--red);color:#fff;border-color:var(--red);align-items:flex-start}
.pn.self .pm{color:rgba(255,255,255,.85)}
.pn .pt{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.pn .pm{font-size:11.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.pn .ring{font-size:11px;padding:0 7px;margin:1px 0}
.pn.self img{width:64px;height:64px;border-radius:10px;object-fit:cover;margin-bottom:4px;border:2px solid rgba(255,255,255,.6)}

/* Tables */
.tblwrap{overflow-x:auto;border:1px solid var(--rule);border-radius:16px;background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);text-align:left;font-weight:700;padding:11px 12px;border-bottom:1px solid var(--rule);white-space:nowrap;background:var(--surface-2)}
td{padding:10px 12px;border-bottom:1px solid var(--rule);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr[data-act]{cursor:pointer}
tbody tr[data-act]:hover td{background:var(--surface-2)}
td.r,th.r{text-align:right}
td .sub{font-size:12.5px;color:var(--ink-2)}
.amt.in{color:var(--leaf);font-weight:600} .amt.out{color:var(--red)}

/* Cruces */
.pair{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:16px;align-items:end}
.pair .x{font-family:var(--display);font-size:34px;color:var(--violet);padding-bottom:4px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field > span{font-size:12px;font-weight:700;color:var(--ink-2)}
.field > span em{font-style:normal;color:var(--red)}
.fbig{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.fbig .pct{font-family:var(--display);font-size:66px;font-weight:700;line-height:.9;font-variant-numeric:tabular-nums}
.fbig .pct small{font-size:24px}
.lvl-ok{color:var(--leaf)} .lvl-mid{color:var(--gold)} .lvl-hi{color:var(--red)}
.fscale{position:relative;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--leaf) 0%,var(--gold) 45%,var(--red) 100%);margin:18px 0 6px}
.fscale i{position:absolute;top:-5px;width:6px;height:22px;background:var(--ink);border:2px solid var(--surface);border-radius:3px;transform:translateX(-50%)}
.fticks{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--ink-3);gap:6px}
.muted{color:var(--ink-2)} .small{font-size:13px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;max-width:68ch}

/* Chart */
.chart svg{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--rule);stroke-width:1}
.chart .bi{fill:var(--teal)} .chart .be{fill:var(--red)}
.chart text{fill:var(--ink-3);font-family:var(--mono);font-size:11px}
.catbars{display:flex;flex-direction:column;gap:10px}
.catbar{display:grid;grid-template-columns:minmax(0,140px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13.5px}
.catbar .track{height:12px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.catbar .track i{display:block;height:100%;border-radius:6px}

/* Modal */
.scrim{position:fixed;inset:0;background:rgba(6,14,10,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.sheet{background:var(--surface);border-radius:18px;width:min(660px,100%);max-height:calc(100% - 32px);display:flex;flex-direction:column;border:1px solid var(--rule);box-shadow:0 24px 60px rgba(0,0,0,.3)}
.sheet.xl{width:min(1120px,100%)}
.sheet header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--rule)}
.sheet header h2{font-size:22px}
.sheet .body{padding:18px 20px;overflow-y:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.sheet .body .wide{grid-column:1/-1}
.sheet footer{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 20px;border-top:1px solid var(--rule);flex-wrap:wrap}
.sheet footer .actions{margin-left:auto}
.err{color:var(--red);font-size:13px;font-weight:600;grid-column:1/-1}
.fphoto{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;align-items:center}
.fphoto .prev{width:120px;height:120px;border-radius:14px;background:var(--surface-2);border:1px dashed var(--rule);display:grid;place-items:center;overflow:hidden;color:var(--ink-3);font-size:12px;text-align:center}
.fphoto .prev img{width:100%;height:100%;object-fit:cover}
.cert img{width:100%;height:auto;border-radius:8px;border:1px solid var(--rule);display:block;background:#fff}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:25;display:grid;place-items:center;padding:20px;cursor:zoom-out}
.viewer img{max-width:100%;max-height:100%;border-radius:10px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:11px 18px;border-radius:12px;font-weight:600;z-index:30;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.backbtn{display:none}
#printArea{display:none}

@media print{
  @page{size:landscape;margin:8mm}
  html,body{height:auto;background:#fff}
  body > *:not(#printArea){display:none!important}
  #printArea{display:block!important}
  #printArea img{width:100%;height:auto;display:block}
}
@media (max-width:1120px){
  :root{--nav-w:86px}
  .brand div,.sync span{display:none}
  .brand{justify-content:center;padding:0}
  .navbtn{flex-direction:column;gap:4px;font-size:10.5px;padding:10px 4px;text-align:center}
  .sync{justify-content:center;padding:8px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero{grid-template-columns:190px minmax(0,1fr)}
  .topbar{padding:12px 20px}
  .page{padding-inline:22px}
}
@media (max-width:920px){
  .split{grid-template-columns:minmax(0,1fr)}
  .split.has-sel .listcol{display:none}
  .split:not(.has-sel) .detail{display:none}
  .backbtn{display:inline-flex;align-self:flex-start}
  .listcol{position:static}
  .avelist{max-height:none}
  .grid2{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  .work{border-radius:0}
  .nav{order:2;flex-direction:row;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));gap:0}
  .brand,.sync{display:none}
  .navlist{flex-direction:row;width:100%;justify-content:space-around}
  .navbtn{font-size:10px;padding:6px 2px;flex:1}
  .topbar{padding:10px 16px}
  .topbar .tright{display:none}
  .page{padding-inline:16px;padding-block:18px 40px}
  .ph h1{font-size:27px}
  .hero{grid-template-columns:minmax(0,1fr)}
  .hinfo h2{font-size:32px}
  .sheet .body{grid-template-columns:minmax(0,1fr)}
  .pair{grid-template-columns:minmax(0,1fr)}
  .pair .x{display:none}
  .fbig .pct{font-size:52px}
  .fticks span:nth-child(2){display:none}
}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="nav">
    <div class="brand"><img src="icon-192.png" alt=""><div><b>Linaje</b><span>Libro de criadero</span></div></div>
    <nav class="navlist" id="navlist"></nav>
    <div class="sync" id="sync"><i class="dot"></i><span id="syncTxt">Guardado en este iPad</span></div>
  </aside>
  <div class="work" id="work">

const MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MESES_L=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
function todayISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fdate(s){if(!s)return '—';const [y,m,d]=s.split('-');return `${+d} ${MESES[+m-1]} ${y}`}
function fdateShort(s){if(!s)return '—';const [y,m,d]=s.split('-');return `${+d} ${MESES[+m-1]}<br>${y}`}
function mesesDe(nac){if(!nac)return null;const [y,m,d]=nac.split('-').map(Number);const n=new Date();let ms=(n.getFullYear()-y)*12+(n.getMonth()+1-m);if(n.getDate()<d)ms--;return ms<0?null:ms}
function edad(nac){const ms=mesesDe(nac);if(ms==null)return '—';const a=Math.floor(ms/12),r=ms%12;return a?`${a} ${a===1?'año':'años'}${r?' '+r+' m':''}`:`${r} ${r===1?'mes':'meses'}`}
const money=n=>{const v=Number(n)||0;return (v<0?'−':'')+'$'+Math.abs(v).toLocaleString('es-MX',{maximumFractionDigits:0})};
const kg=n=>(n===''||n==null||isNaN(Number(n))||Number(n)===0)?'—':Number(n).toFixed(3)+' kg';
const pct=(f,d=2)=>(f*100).toFixed(d).replace(/\.?0+$/,'')+'%';
const pl=(n,w)=>`${n} ${w}${n===1?'':'s'}`;
const newId=()=>'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);

const CATCOL={'Alimento':'--gold','Vacunas y medicina':'--red','Vitaminas y suplementos':'--orange','Mano de obra':'--blue','Instalaciones y equipo':'--slate','Inscripciones y traslados':'--violet','Compra de aves':'--pink','Otro gasto':'--slate'};

function saveLocal(){if(state.demo)return;try{localStorage.setItem(LS_KEY,JSON.stringify({records:state.records}))}catch(e){toast('No se pudo guardar en el iPad. Revisa el espacio libre y descarga un respaldo.')}}

/* ---------- queries ---------- */
const all=k=>Object.values(state.records).filter(r=>r&&r.kind===k);
const aves=()=>all('ave');
const ave=id=>{const r=id&&state.records[id];return r&&r.kind==='ave'?r:null};
const nombre=a=>a?(a.nombre||(a.placa?'Anillo '+a.placa:'Sin nombre')):'Sin registro';
const cfg=()=>state.records.cfg||{nombre:'Mi criadero'};
function categoria(a){const m=mesesDe(a.nac);const joven=m!=null&&m<12;return a.sexo==='M'?(joven?'Pollo':'Gallo'):(joven?'Polla':'Gallina')}
function recordDe(id){let g=0,p=0,t=0;for(const x of all('pelea'))if(x.ave===id){x.resultado==='G'?g++:x.resultado==='P'?p++:t++}return{g,p,t,n:g+p+t}}
function recHTML(r){return `<span class="rec" title="Ganadas · Perdidas · Tablas"><span class="g">${r.g}G</span><span class="p">${r.p}P</span><span class="t">${r.t}T</span></span>`}
const lineas=()=>[...new Set(aves().map(a=>a.linea).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es'));
function colorLinea(l){const i=lineas().indexOf(l);return i<0?'var(--slate)':`var(${LCOL[i%LCOL.length]})`}
function hexLinea(l){const i=lineas().indexOf(l);return i<0?'#7c8b81':LHEX[i%LHEX.length]}
function ringHTML(a,cls='',q=''){
  if(!a||!a.placa)return `<span class="ring none ${cls}">Sin anillo</span>`;
  let t=esc(a.placa);
  const n=normRing(q);
  if(n){const raw=a.placa;let i=-1,len=0;
    for(let s=0;s<raw.length&&i<0;s++){if(/[\s\-_.\/#]/.test(raw[s]))continue;for(let e=s+1;e<=raw.length;e++){const sub=normRing(raw.slice(s,e));if(sub===n){i=s;len=e-s;break}if(!n.startsWith(sub))break}}
    if(i>=0)t=esc(raw.slice(0,i))+'<mark>'+esc(raw.slice(i,i+len))+'</mark>'+esc(raw.slice(i+len));}
  return `<span class="ring ${cls}">${t}</span>`;
}
function iniciales(a){const n=(a.nombre||'').trim();if(n){const p=n.split(/\s+/);return (p[0][0]+(p[1]?p[1][0]:'')).toUpperCase()}return (a.placa||'?').slice(-2)}
function avatar(a,size='md'){const t=fotos.thumbs.get(a.id);return t?`<img class="av ${size}" src="${t}" alt="">`:`<span class="av ${size} ph" style="--c:${colorLinea(a.linea)}">${esc(iniciales(a))}</span>`}
function buscar(q){
  const n=normRing(q);const qn=q.trim().toLowerCase();if(!n&&!qn)return [];
  return aves().map(a=>{const r=normRing(a.placa);let s=-1;
    if(n&&r===n)s=100;else if(n&&r.startsWith(n))s=80;else if(n&&r.endsWith(n))s=70;else if(n&&r.includes(n))s=60;
    else if(qn&&(a.nombre||'').toLowerCase().includes(qn))s=30;else if(qn&&(a.linea||'').toLowerCase().includes(qn))s=10;
    return {a,s}}).filter(x=>x.s>=0).sort((x,y)=>y.s-x.s||(x.a.placa||'').localeCompare(y.a.placa||'','es',{numeric:true}));
}

/* ---------- genetics ---------- */
let memo={gen:new Map(),kin:new Map(),comp:new Map()};
function invalidate(){memo={gen:new Map(),kin:new Map(),comp:new Map()}}
function genOf(id,d=0){if(!id||!ave(id)||d>50)return 0;if(memo.gen.has(id))return memo.gen.get(id);const a=ave(id);const g=1+Math.max(genOf(a.padre,d+1),genOf(a.madre,d+1));memo.gen.set(id,g);return g}
function Fof(id){const a=ave(id);return a?kin(a.padre,a.madre,0):0}
function kin(x,y,d){
  if(!x||!y||!ave(x)||!ave(y)||d>60)return 0;
  const key=x<y?x+'|'+y:y+'|'+x;if(memo.kin.has(key))return memo.kin.get(key);
  let v;
  if(x===y)v=.5*(1+Fof(x));
  else{const [a,b]=genOf(x)>=genOf(y)?[x,y]:[y,x];const A=ave(a);v=.5*(kin(A.padre,b,d+1)+kin(A.madre,b,d+1))}
  memo.kin.set(key,v);return v;
}
function mix(a,b){const o={};for(const k in a)o[k]=(o[k]||0)+a[k]/2;for(const k in b)o[k]=(o[k]||0)+b[k]/2;return o}
function comp(id,d=0){
  const a=ave(id);if(!a)return{'Sin registro':1};
  if(memo.comp.has(id))return memo.comp.get(id);
  const own=a.linea||'Sin línea';let r;
  if(d>30||(!ave(a.padre)&&!ave(a.madre)))r={[own]:1};
  else{const half=x=>ave(x)?comp(x,d+1):{[own]:1};r=mix(half(a.padre),half(a.madre))}
  memo.comp.set(id,r);return r;
}
function ancestros(id,max=8){const out=new Map();(function walk(x,d){const a=ave(x);if(!a||d>max)return;for(const p of [a.padre,a.madre])if(ave(p)){if(!out.has(p)||out.get(p)>d)out.set(p,d);walk(p,d+1)}})(id,1);return out}
function esDescendiente(cand,de){return cand===de||ancestros(cand,60).has(de)}
function nivelF(f){
  const p=f*100;
  if(p===0)return{t:'Sin parentesco registrado',c:'ok',d:'Los padres no comparten ancestros en tu registro. Es una exocruza: suele aportar vigor híbrido.'};
  if(p<3.2)return{t:'Consanguinidad baja',c:'ok',d:'Equivale a primos segundos o a un parentesco lejano.'};
  if(p<6.3)return{t:'Consanguinidad leve',c:'mid',d:'Parecida a cruzar primos hermanos. Habitual en una cruza en línea.'};
  if(p<12.6)return{t:'Consanguinidad moderada',c:'mid',d:'Como medios hermanos o tío con sobrina. Ayuda a fijar rasgos; vigila fertilidad, vigor y tamaño de las crías.'};
  return{t:'Consanguinidad alta',c:'hi',d:'Como hermanos completos o padre con hija. Fija rasgos rápido, pero sube el riesgo de defectos y la pérdida de vigor.'};
}
function compHTML(c){
  const ents=Object.entries(c).sort((a,b)=>b[1]-a[1]);

  <div class="legend">${ents.map(([l,v])=>`<span><b style="background:${colorLinea(l)}"></b>${esc(l)} <span class="num muted">${pct(v,1)}</span></span>`).join('')}</div>`;
}

/* ---------- photos (IndexedDB, stays on the iPad) ---------- */
const fotos={thumbs:new Map(),full:new Map()};
let idb=null;
function idbOpen(){return new Promise(res=>{try{const r=indexedDB.open('linaje-fotos',1);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('thumbs'))d.createObjectStore('thumbs');if(!d.objectStoreNames.contains('full'))d.createObjectStore('full')};r.onsuccess=()=>{idb=r.result;res(idb)};r.onerror=()=>res(null)}catch(e){res(null)}})}
function idbReq(store,mode,fn){return new Promise((res,rej)=>{if(!idb)return rej(new Error('Sin almacenamiento de fotos'));const tx=idb.transaction(store,mode);const q=fn(tx.objectStore(store));tx.oncomplete=()=>res(q?q.result:undefined);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)})}
async function loadThumbs(){await idbOpen();if(!idb)return;try{const keys=await idbReq('thumbs','readonly',s=>s.getAllKeys());const vals=await idbReq('thumbs','readonly',s=>s.getAll());keys.forEach((k,i)=>fotos.thumbs.set(k,vals[i]));render()}catch(e){}}
async function getFull(id){if(fotos.full.has(id))return fotos.full.get(id);if(!idb||!fotos.thumbs.has(id))return null;try{const v=await idbReq('full','readonly',s=>s.get(id));if(v){fotos.full.set(id,v);if(fotos.full.size>10)fotos.full.delete(fotos.full.keys().next().value)}return v||null}catch(e){return null}}
async function setFoto(id,f){await idbReq('full','readwrite',s=>s.put(f.full,id));await idbReq('thumbs','readwrite',s=>s.put(f.thumb,id));fotos.full.set(id,f.full);fotos.thumbs.set(id,f.thumb)}
async function delFoto(id){try{await idbReq('full','readwrite',s=>s.delete(id));await idbReq('thumbs','readwrite',s=>s.delete(id))}catch(e){}fotos.full.delete(id);fotos.thumbs.delete(id)}
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('img'));i.src=src})}
async function procesarFoto(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await loadImg(url);const W=img.naturalWidth,H=img.naturalHeight;
    const k=Math.min(1,1400/Math.max(W,H));const c=document.createElement('canvas');c.width=Math.round(W*k);c.height=Math.round(H*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);const full=c.toDataURL('image/jpeg',.84);
    const t=document.createElement('canvas');t.width=t.height=260;const s=Math.min(W,H);
    t.getContext('2d').drawImage(img,(W-s)/2,(H-s)*.3,s,s,0,0,260,260);const thumb=t.toDataURL('image/jpeg',.8);
    return{full,thumb};
  }finally{URL.revokeObjectURL(url)}
}

function chartMeses(d){
  const W=560,H=220,L=56,B=28,T=10,R=8;
  const mx=Math.max(1,...d.map(x=>Math.max(x.i,x.e)));
  const step=[1000,2000,5000,10000,20000,50000,100000,200000,500000].find(s=>mx/s<=5)||Math.ceil(mx/5);
  const top=Math.ceil(mx/step)*step;const y=v=>T+(H-T-B)*(1-v/top);
  const cw=(W-L-R)/d.length,bw=Math.min(24,cw/3);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ingresos y gastos por mes">`;
  for(let v=0;v<=top;v+=step){s+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${v>=1000?(v/1000)+'k':v}</text>`}
  d.forEach((m,i)=>{const cx=L+cw*i+cw/2;
    s+=`<rect class="bi" x="${cx-bw-2}" y="${y(m.i)}" width="${bw}" height="${Math.max(0,y(0)-y(m.i))}" rx="3"><title>Ingresos ${money(m.i)}</title></rect>`;
    s+=`<rect class="be" x="${cx+2}" y="${y(m.e)}" width="${bw}" height="${Math.max(0,y(0)-y(m.e))}" rx="3"><title>Gastos ${money(m.e)}</title></rect>`;
    s+=`<text x="${cx}" y="${H-8}" text-anchor="middle">${MESES[+m.k.slice(5)-1]}</text>`});
  return s+'</svg>';
}

async function submit(){
  const frm=$('#frm');if(!frm)return;const kind=frm.dataset.kind,id=frm.dataset.id;const d=formData();const old=state.records[id]||{};
  let rec;
  if(kind==='ave'){
    d.placa=(d.placa||'').toUpperCase();
    if(!d.placa)return formErr('Escribe el número de anillo.');
    const dup=aves().find(x=>x.id!==id&&normRing(x.placa)===normRing(d.placa));
    if(dup)return formErr(`El anillo ${d.placa} ya es de ${nombre(dup)}. Cada ave necesita un anillo distinto.`);
    rec={...old,...d,id,kind,peso:d.peso?Number(d.peso):''};
  }else if(kind==='pelea'){
    if(!d.ave)return formErr('Elige el ejemplar.');if(!d.fecha)return formErr('Pon la fecha de la pelea.');
    rec={...old,...d,id,kind,peso:d.peso?Number(d.peso):'',minutos:d.minutos?Number(d.minutos):''};
  }else if(kind==='mov'){
    if(!(Number(d.monto)>0))return formErr('El monto debe ser mayor a cero.');
    rec={...old,...d,id,kind,monto:Number(d.monto)};
  }else if(kind==='cruce'){rec={...(state._cruceDraft||{}),...old,...d,id,kind}}
  const foto=state._foto;
  if(kind==='ave'&&foto&&foto!=='quitar'){try{await setFoto(id,foto)}catch(e){return formErr('No se pudo guardar la foto en el iPad. Revisa el espacio libre.')}}
  if(kind==='ave'&&foto==='quitar')await delFoto(id);
  if(commit(rec)){closeModal();toast('Guardado');if(kind==='ave'&&!old.id){state.view='aves';state.selAve=id;state.q='';render()}}
}

  rr(x,X,Y,w,h,h/2);x.fillStyle=g;x.fill();x.strokeStyle='#9aa6b0';x.lineWidth=1.5;x.stroke();
  x.fillStyle='#1b2530';x.textBaseline='middle';x.fillText(text,X+size*.65,Y+h/2+1);x.textBaseline='alphabetic';return w;
}

  const a=ave(id);if(!a)return;
  openModal(`Pedigrí · ${a.placa||nombre(a)}`,`<div class="body"><div class="wide cert"><p class="muted">Preparando el certificado…</p></div></div>`,
   `<span class="muted small">Tamaño carta horizontal</span><div class="actions"><button class="btn" data-act="certShare">${IC.share}Compartir o guardar imagen</button><button class="btn pri" data-act="certPrint">${IC.print}Imprimir</button></div>`,'xl');
  try{
    const cv=await certificado(a);const url=cv.toDataURL('image/png');
    const blob=await new Promise(r=>cv.toBlob(r,'image/png'));
    state._cert={url,blob,name:`pedigri-${normRing(a.placa)||a.id}.png`};
    const body=$('#modal .cert');if(body)body.innerHTML=`<img src="${url}" alt="Pedigrí de ${esc(nombre(a))}">`;
  }catch(e){const body=$('#modal .cert');if(body)body.innerHTML='<p class="err">No se pudo generar el certificado.</p>'}
}
async function certPrint(){
  const c=state._cert;if(!c)return;const pa=$('#printArea');pa.innerHTML=`<img src="${c.url}" alt="">`;
  const img=pa.querySelector('img');if(!img.complete)await new Promise(r=>{img.onload=r;img.onerror=r});
  setTimeout(()=>{try{window.print()}catch(e){toast('Usa “Compartir o guardar imagen” y elige Imprimir.')}},60);
}
async function shareFile(blob,name,title){
  const file=new File([blob],name,{type:blob.type});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title});return true}catch(e){if(e&&e.name==='AbortError')return false}}
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);toast('Guardado en Archivos › Descargas');return true;
}

/* ---------- backup ---------- */
async function exportar(){
  if(state.demo){toast('El ejemplo no se respalda. Empieza tu criadero primero.');return}
  toast('Preparando respaldo…');
  const fotosOut={};
  for(const a of aves()){if(fotos.thumbs.has(a.id)){const f=await getFull(a.id);fotosOut[a.id]={full:f||fotos.thumbs.get(a.id),thumb:fotos.thumbs.get(a.id)}}}
  const data=JSON.stringify({app:'linaje',version:2,exportado:new Date().toISOString(),records:state.records,fotos:fotosOut});
  const blob=new Blob([data],{type:'application/json'});
  const ok=await shareFile(blob,`linaje-respaldo-${todayISO()}.json`,'Respaldo de Linaje');
  if(ok){try{localStorage.setItem(LS_BK,new Date().toISOString())}catch(e){}render()}
}
function importar(input){
  const file=input.files&&input.files[0];input.value='';if(!file)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const o=JSON.parse(rd.result);const recs=o&&o.records;if(!recs||typeof recs!=='object')throw 0;
      const n=Object.values(recs).filter(r=>r&&r.kind==='ave').length;const nf=o.fotos?Object.keys(o.fotos).length:0;
      confirmar(`El respaldo tiene ${n} ejemplares${nf?` y ${nf} fotos`:''}. Se agregarán a tu criadero y reemplazarán los registros iguales.`,'Restaurar',async()=>{
        if(state.demo){state.demo=false;state.records={}}
        for(const [id,r] of Object.entries(recs))if(r&&r.kind&&r.id===id)state.records[id]=r;
        if(o.fotos)for(const [id,f] of Object.entries(o.fotos)){if(f&&f.full&&f.thumb)try{await setFoto(id,f)}catch(e){}}
        invalidate();saveLocal();closeModal();render();toast('Respaldo restaurado');
      });
    }catch(e){toast('Ese archivo no es un respaldo de Linaje.')}
  };
  rd.readAsText(file);
}

/* ---------- actions ---------- */
function goAve(id){state.view='aves';state.selAve=id||null;if(id&&!filtrarAves().some(a=>a.id===id)){state.fEstado='todos';state.fSexo='';state.q=''}render();$('#main').scrollTop=0}
const ACT={
  go:d=>{state.view=d.v;render();$('#main').scrollTop=0},
  selAve:d=>goAve(d.id),
  rsOpen:d=>{clearRS();$('#ringq').blur();goAve(d.id)},
  fSexo:d=>{state.fSexo=d.v;render()},
  newAve:()=>state.demo?askStart():aveForm(null),
  newAveRing:d=>{clearRS();state.demo?askStart():aveForm(null,d.ring)},
  editAve:d=>aveForm(ave(d.id)),
  newPelea:d=>state.demo?askStart():peleaForm(null,d.ave),
  editPelea:d=>peleaForm(state.records[d.id]),
  newMov:d=>state.demo?askStart():movForm(null,d.tipo),
  editMov:d=>movForm(state.records[d.id]),
  openCruce:d=>cruceForm(state.records[d.id]),
  verCruce:d=>{closeModal();state.cruce={padre:d.p,madre:d.m};state.view='cruces';render();$('#main').scrollTop=0},
  cruzar:d=>{const a=ave(d.id);state.cruce=a.sexo==='M'?{padre:a.id,madre:state.cruce.madre}:{padre:state.cruce.padre,madre:a.id};state.view='cruces';render();$('#main').scrollTop=0},
  setMadre:d=>{state.cruce.madre=d.id;render()},
  saveCruce:()=>{const {padre,madre}=state.cruce;cruceForm({id:newId(),kind:'cruce',padre,madre,fecha:todayISO(),estado:'Planeado',notas:''})},
  pedPrint:d=>pedPrint(d.id),
  certPrint:()=>certPrint(),
  certShare:()=>{const c=state._cert;if(c&&c.blob)shareFile(c.blob,c.name,'Pedigrí')},
  viewFoto:d=>viewFoto(d.id),
  fotoQuitar:()=>{state._foto='quitar';$('#fPrev').innerHTML='Sin foto'},
  close:()=>closeModal(),
  submit:()=>submit(),
  del:d=>{const r=state.records[d.id];const label=r.kind==='ave'?`el ejemplar con anillo ${r.placa||nombre(r)}`:r.kind==='pelea'?'esta pelea':r.kind==='mov'?'este movimiento':'este cruce';
    const hijos=r.kind==='ave'?aves().filter(x=>x.padre===r.id||x.madre===r.id).length:0;
    confirmar(`¿Eliminar ${esc(label)}?${hijos?` Tiene ${hijos} crías registradas; su pedigrí quedará sin este ancestro.`:''} No se puede deshacer.`,'Eliminar',()=>{
      if(remove(d.id)){if(state.selAve===d.id)state.selAve=null;closeModal();render();toast('Eliminado')}})},
  confirmOk:()=>{const f=state._confirm;state._confirm=null;if(f)f()},
  startReal:()=>confirmar('Se quitan los datos de ejemplo y empiezas con un criadero vacío.','Empezar mi criadero',startReal),
  saveCfg:()=>{const v=$('#cfgNombre').value.trim()||'Mi criadero';if(commit({...cfg(),id:'cfg',kind:'cfg',nombre:v,criador:$('#cfgCriador').value.trim(),contacto:$('#cfgContacto').value.trim()}))toast('Guardado')},
  exportar:()=>exportar(),
  wipe:()=>confirmar('Se borrará todo tu criadero de este iPad, fotos incluidas. Descarga un respaldo antes si lo necesitas.','Borrar todo',async()=>{for(const a of aves())await delFoto(a.id);state.records={};state.selAve=null;invalidate();saveLocal();closeModal();render();toast('Criadero borrado')})
};
document.addEventListener('click',e=>{
  if(e.target===$('#modal')){closeModal();return}
  if(e.target.closest('#viewer')){$('#viewer').hidden=true;$('#viewer').innerHTML='';return}
  if(!e.target.closest('.ringsearch'))$('#rsres').hidden=true;
  const t=e.target.closest('[data-act]');if(!t)return;
  const fn=ACT[t.dataset.act];if(fn){e.preventDefault();fn(t.dataset,t)}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(!$('#viewer').hidden){$('#viewer').hidden=true;return}if(!$('#modal').hidden)closeModal()}
  if(e.key==='Enter'&&e.target.closest&&e.target.closest('#frm')&&e.target.tagName==='INPUT'){e.preventDefault();submit()}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.row[data-act],tr[data-act]')){e.preventDefault();e.target.click()}
});
let qT=null;
document.addEventListener('input',e=>{const b=e.target.dataset&&e.target.dataset.bind;if(b==='q'){state.q=e.target.value;clearTimeout(qT);qT=setTimeout(render,120)}});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='fotoForm')return onFotoForm(t);
  if(t.id==='fotoDetalle')return onFotoDetalle(t);
  if(t.id==='impFile')return importar(t);
  const b=t.dataset&&t.dataset.bind;if(!b)return;const v=t.value;
  if(b==='fEstado')state.fEstado=v;else if(b==='pAve')state.pAve=v;else if(b==='fMes')state.fMes=v;
  else if(b==='cPadre')state.cruce.padre=v;else if(b==='cMadre')state.cruce.madre=v;else return;
  render();
});
document.addEventListener('submit',e=>e.preventDefault());

/* ---------- boot ---------- */
if(!loadLocal()){state.records=demoData();state.demo=true;state.cruce={padre:'c1',madre:'c3'}}
render();
loadThumbs();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
